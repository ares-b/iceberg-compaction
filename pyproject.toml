[project]
name = "iceberg-compaction"
version = "0.1.0"
description = "Iceberg Compaction Job"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyiceberg[pyarrow]>=0.12.0,<0.13",
]

[project.optional-dependencies]
duckdb = [
    "duckdb>=1.5.6,<2",
    "jinja2>=3.1,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "iceberg-compaction[duckdb]",
    "pyiceberg[sql-sqlite]>=0.12.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["tests"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "SIM"]
